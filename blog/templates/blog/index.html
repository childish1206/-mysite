<!DOCTYPE html>
<html>
<head>
    <title>Django Blog</title>
</head>
<body>
    <h1>文章列表</h1>
    {% if user.is_authenticated %}
        <p>歡迎 {{ user.username }}！</p>
    <form method="POST" action="/accounts/logout/">
        {% csrf_token %}
        <button type="submit">登出</button>
    </form>
    {% else %}
        <a href="/accounts/login/">登入</a>
    {% endif %}
    {% for post in posts %}
        <div>
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
        </div>
    {% endfor %}
</body>
</html>
